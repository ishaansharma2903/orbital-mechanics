[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbital-mechanics"
version = "0.1.0"
description = "A Python library for orbital mechanics, mission design, and trajectory optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ishaan Sharma" },
]
dependencies = [
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
# Everything needed for local development: testing, plus what upcoming
# phases (Lambert solver validation, ephemeris pulls) will need.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scipy>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_mechanics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
